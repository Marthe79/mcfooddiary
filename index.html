<style>
/* Layout: app de una columna (máx. 560px), cabecera arriba y barra de pestañas fija abajo, como una app de iPhone. */
:root{
  --bg:#F5F2EA; --surface:#FFFFFF; --surface-2:#ECE7DB; --ink:#1E211B; --muted:#646A5C; --line:#DCD6C8;
  --accent:#3E6B2C; --accent-ink:#FFFFFF; --accent-soft:#E1ECD6;
  --warm:#C2491D; --warm-soft:#F8E1D5; --danger:#B42318;
  --shadow:0 1px 2px rgba(30,33,27,.07),0 8px 20px rgba(30,33,27,.05);
  --f-display:"Fraunces",Georgia,serif; --f-body:"Figtree",-apple-system,"Helvetica Neue",Arial,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12140F; --surface:#1B1E17; --surface-2:#262A21; --ink:#ECEEE6; --muted:#A1A794; --line:#30352A;
  --accent:#9BCB7C; --accent-ink:#13200B; --accent-soft:#25331C; --warm:#F08A5D; --warm-soft:#3A2419; --danger:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12140F; --surface:#1B1E17; --surface-2:#262A21; --ink:#ECEEE6; --muted:#A1A794; --line:#30352A;
  --accent:#9BCB7C; --accent-ink:#13200B; --accent-soft:#25331C; --warm:#F08A5D; --warm-soft:#3A2419; --danger:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;font-weight:700}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:24px}
.brand svg{width:30px;height:30px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}

/* Tarjetas y botones */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.warm{background:var(--warm-soft);color:var(--warm)}

/* Formularios */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.err{color:var(--danger);font-size:14px;min-height:1em} .ok-msg{color:var(--accent);font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stepper button{width:42px;height:42px;border:0;background:none;font-size:20px;font-weight:600}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ico{font-size:24px;width:32px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.opts{grid-template-columns:1fr}}

/* Semana */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day.today{border-color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.dayhead b{font-family:var(--f-display);font-size:17px}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;min-height:62px}
.slot:first-of-type{border-top:0}
.slot .meal{width:68px;flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.slot .emo{width:40px;height:40px;flex:none;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px}
.slot .t{font-weight:600;line-height:1.25}
.slot .add{color:var(--accent);font-weight:600}
.slot.empty .emo{background:transparent;border:1.5px dashed var(--line);color:var(--accent);font-size:20px}

/* Recetas */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.rgrid{grid-template-columns:1fr}}
.rcard{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.rcard .emo{height:76px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:40px;position:relative}
.rcard .fav{position:absolute;top:6px;right:8px;font-size:16px}
.rcard .flag{position:absolute;top:6px;left:8px;font-size:16px}
.rcard .t{font-weight:700;line-height:1.25}
.rcard .meta{font-size:13px;color:var(--muted)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:42px}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.ritem .emo{width:44px;height:44px;flex:none;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:24px}

/* Detalle de receta (hoja inferior) */
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim.anim{animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.anim .sheet{animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheethead{position:sticky;top:-8px;background:var(--bg);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 8px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero{display:flex;gap:14px;align-items:center}
.hero .emo{width:72px;height:72px;flex:none;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:40px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 40px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
.methods{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:left}
.mbtn small{font-weight:500;color:var(--muted);font-size:12px}
.mbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.off{opacity:.6}
.pickgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.pickgrid .pg{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickgrid .pg.busy{color:var(--muted);font-weight:500}

/* Lista de la compra */
.aisle h3{font-size:16px;font-family:var(--f-body);font-weight:700;margin-bottom:4px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.item:last-child{border-bottom:0}
.box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .box svg{width:14px;height:14px}
.item .q{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{position:relative}
.tab .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Diario */
.slotw{position:relative;border-top:1px solid var(--line)}
.slotw .slot{border-top:0}
.slotw .eat{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%}
.eat.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.bar .bv{position:relative;width:100%;height:90px;border-radius:8px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.bar .bv i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0}
.bar .bv em{position:absolute;left:0;right:0;height:2px;background:var(--warm)}
.bar .bl{font-size:12px;font-weight:600;color:var(--muted)}
.bar.on .bl{color:var(--accent)}

/* Progreso */
.verdict{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--tone);border-radius:14px;background:var(--surface);text-align:left}
.verdict .vi{font-size:22px}
.verdict svg{width:18px;height:18px;color:var(--muted)}
.verdictbox{border-left:4px solid var(--tone);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pchart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Nutrición */
.macrobar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.macrobar i{display:block;height:100%}
.kt{width:100%;border-collapse:collapse;font-size:14px}
.kt th,.kt td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.kt tbody tr:last-child th,.kt tbody tr:last-child td{border-bottom:0}
.dayk{font-size:12px;font-weight:600;color:var(--muted)}
.dayk.over{color:var(--warm)}

/* Amigos */
.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person .grow{flex:1 1 150px;min-width:0}
.person .nm{overflow-wrap:anywhere}
.person:last-child{border-bottom:0}
.avatar{width:42px;height:42px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;text-transform:uppercase}
.person .nm{font-weight:700} .person .acts{display:flex;gap:6px;flex:none;margin-left:auto}
.inbox-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:0}
.inbox-item.new .avatar{background:var(--warm-soft);color:var(--warm)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

/* Acceso */
.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding-block:32px}
.logo{display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:var(--accent);color:var(--accent-ink);margin-bottom:8px}
.logo svg{width:42px;height:42px}
.dots{display:flex;gap:6px}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--surface-2)}
.dots i.on{background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:fade .15s}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
'use strict';
/* ---------- Datos fijos ---------- */
const ING=window.MC_INGREDIENTES, RECETAS=window.MC_RECETAS, METODOS=window.MC_METODOS, PASILLOS=window.MC_PASILLOS;
const RMAP=Object.fromEntries(RECETAS.map(r=>[r.id,r]));
const BASE=4; // raciones de las recetas del catálogo
const SUPERS=[['mercadona','Mercadona'],['carrefour','Carrefour'],['lidl','Lidl'],['dia','Dia'],['alcampo','Alcampo'],['eroski','Eroski'],['consum','Consum'],['aldi','Aldi'],['eci','El Corte Inglés · Hipercor'],['ahorramas','Ahorramás'],['bm','BM Supermercados'],['gadis','Gadis'],['bonpreu','Bonpreu · Esclat'],['masymas','masymas'],['froiz','Froiz'],['hiperdino','HiperDino'],['otro','Otro']];
const SUPER_N=Object.fromEntries(SUPERS);

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* Cantidad legible a partir de gramos/mililitros/unidades */
function fmtQty(key,q){
  const u=ING[key][3];
  if(u==='ud'){const n=Math.ceil(q-0.05);return key==='ajo'?n+(n===1?' diente':' dientes'):n+' ud'}
  const big=u==='kg'?'kg':'l', small=u==='kg'?'g':'ml';
  if(q>=1000)return (Math.round(q/100)/10).toLocaleString('es-ES')+' '+big;
  const r=q<50?Math.max(1,Math.round(q)):Math.round(q/10)*10;
  return r+' '+small;
}
function cost(key,q){const [, , p,u]=ING[key];return u==='ud'?p*q:p*q/1000}
function recipeCost(r,rac){const f=rac/BASE;return r.ing.reduce((s,[k,q])=>s+cost(k,q*f),0)}

/* ---------- Lógica de recetas ---------- */
const P=()=>S.perfil||{personas:2,aparatos:['fuego'],dieta:'todo',super:'mercadona',planificar:{comida:true,cena:true},mezcla:'poco',cocinas:[],objetivo:'internacional',kcal:2000};
function usableMethods(r){const ap=P().aparatos;return Object.keys(r.m).filter(k=>k==='sin'||ap.includes(k))}
function defMethod(r){return usableMethods(r)[0]||Object.keys(r.m)[0]}
function dietOk(r){const d=P().dieta;if(d==='vegetariano')return r.tags.includes('vegetariano');if(d==='pescetariano')return r.tags.includes('vegetariano')||r.tags.includes('pescado');return true}
const SNACK=t=>t==='desayuno'||t==='merienda'||t==='tentempie';
const mealOk=(r,meal)=>meal==='desayuno'||meal==='merienda'?r.tipo===meal||r.tipo==='tentempie':r.tipo==='ambos'||r.tipo===meal;
const usable=r=>dietOk(r)&&usableMethods(r).length>0;
const isFav=id=>S.favs.includes(id);
const mainTag=r=>['legumbres','pescado','carne','vegetariano'].find(t=>r.tags.includes(t))||'otro';

/* ---------- Semana ---------- */
let weekStart=monday(new Date());
const wk=()=>ymd(weekStart);
const plan=()=>(S.semanas[wk()]||={});
const slotKey=(d,m)=>d+'-'+m;
const planned=m=>{const v=P().planificar?.[m];return m==='comida'||m==='cena'?v!==false:v===true};
const meals=()=>MEALS.filter(([m])=>planned(m));

function fillWeek(){
  const p=plan(),used=new Set(Object.values(p).map(s=>s.r));let n=0;
  for(let d=0;d<7;d++)for(const [m] of meals()){
    const k=slotKey(d,m);if(p[k])continue;
    const other=p[slotKey(d,m==='comida'?'cena':'comida')];const avoid=other?mainTag(RMAP[other.r]):null;
    let pool=RECETAS.filter(r=>usable(r)&&mealOk(r,m)&&!used.has(r.id));
    // Objetivo: recetas que encajan y cerca de las calorías de esa comida
    if(goal()!=='internacional'){
      const t=slotTarget(m),lose=goal()==='perder',fit=pool.filter(r=>fitsGoal(r,goal()));
      const win=(lo,hi)=>fit.filter(r=>{const k=nut(r).kcal;return k>=t*lo&&k<=t*hi});
      let g=lose?win(.5,1.05):win(.8,1.2);if(g.length<3)g=lose?win(0,1.25):win(.55,1.35);if(g.length>=3)pool=g}
    const varied=pool.filter(r=>mainTag(r)!==avoid);if(varied.length)pool=varied;
    // Mezcla de cocinas: de aquí o internacional (dando preferencia a las cocinas favoritas)
    const intl=Math.random()<PINTL[P().mezcla||'poco'],favs=P().cocinas||[];
    const side=pool.filter(r=>intl?coOf(r)!=='es':coOf(r)==='es');if(side.length)pool=side;
    if(intl&&favs.length){const fv=pool.filter(r=>favs.includes(coOf(r)));if(fv.length)pool=fv}
    if(!pool.length)pool=RECETAS.filter(r=>usable(r)&&mealOk(r,m));
    if(!pool.length)continue;
    // Las favoritas tienen el doble de probabilidad
    const bag=pool.flatMap(r=>isFav(r.id)?[r,r]:[r]);const r=bag[Math.floor(Math.random()*bag.length)];
    p[k]={r:r.id,m:defMethod(r)};used.add(r.id);n++;
  }
  save();render();toast(n?`Añadidos ${n} platos a la semana`:'La semana ya está completa');
}
function weekStats(){
  const p=plan();let platos=0,total=0;
  for(const s of Object.values(p)){const r=RMAP[s.r];if(!r)continue;platos++;total+=recipeCost(r,s.p||P().personas)}
  return {platos,huecos:7*meals().length,total};
}

/* ---------- Lista de la compra ---------- */
function shopping(){
  const p=plan(),agg={},basics=new Set();
  for(const s of Object.values(p)){const r=RMAP[s.r];if(!r)continue;const f=(s.p||P().personas)/BASE;
    for(const [k,q] of r.ing){if(!ING[k])continue;if(ING[k][4]){basics.add(k);continue}agg[k]=(agg[k]||0)+q*f}}
  const groups={};
  for(const [k,q] of Object.entries(agg)){(groups[ING[k][1]]||=[]).push({k,q,c:cost(k,ING[k][3]==='ud'?Math.ceil(q-0.05):q)})}
  for(const g of Object.values(groups))g.sort((a,b)=>ING[a.k][0].localeCompare(ING[b.k][0],'es'));
  const total=Object.values(groups).flat().reduce((s,i)=>s+i.c,0);
  return {groups,basics:[...basics],total};
}

  for(let d=0;d<7;d++){
    const date=addDays(weekStart,d);
    const dk=meals().reduce((t,[m])=>{const s=p[slotKey(d,m)],r=s&&RMAP[s.r];return t+(r?nut(r).kcal:0)},0),obj=goal()!=='internacional'?Math.round((P().kcal||KCAL_DEF[goal()])*meals().reduce((t,[m])=>t+REPARTO[m],0)/10)*10:0;

    for(const [m,mn] of meals()){
      const s=p[slotKey(d,m)],r=s&&RMAP[s.r];
      const past=ymd(date)<=today,ate=past&&r&&isLogged(date,m,r.id);
      h+=r?`<div class="slotw"><button class="slot" data-a="slot" data-d="${d}" data-m="${m}" ${past?'style="padding-right:58px"':''}><span class="meal">${mn}</span><span class="emo">${r.e}</span><span class="grow"><span class="t">${esc(r.n)}</span><br><span class="muted small">${coOf(r)!=='es'?flag(r)+' ':''}${METODOS[s.m]?.c||''} · ${r.m[s.m]?.[0]||''} min · ${fmtN(nut(r).kcal)} kcal</span></span></button>${past?`<button class="iconbtn eat ${ate?'on':''}" data-a="eat" data-d="${d}" data-m="${m}" aria-pressed="${!!ate}" aria-label="${ate?'Quitar del diario':'Lo he comido'}: ${esc(r.n)}">${I.check}</button>`:''}</div>`
        :`<button class="slot empty" data-a="slot" data-d="${d}" data-m="${m}"><span class="meal">${mn}</span><span class="emo">+</span><span class="add">Añadir plato</span></button>`;

    h+='</section>';
  }

function filtered(){
  const s=q.trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
  return RECETAS.filter(r=>{
    if(soloMios&&!usable(r))return false;
    if(filtro==='fav'&&!isFav(r.id))return false;
    if((filtro==='comida'||filtro==='cena')&&!mealOk(r,filtro))return false;
    if(!['todas','fav','comida','cena'].includes(filtro)&&!r.tags.includes(filtro))return false;
    if(cocina!=='all'&&coOf(r)!==cocina)return false;
    if(!objFilterOk(r,objF||defObjF()))return false;
    if(s){const hay=(r.n+' '+coName(r)+' '+r.ing.map(([k])=>ING[k][0]).join(' ')).toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');if(!hay.includes(s))return false}
    return true});
}

  if(!items.length&&!st.x.length)return nav+`<div class="card empty"><div class="big">🛒</div><h2>La lista está vacía</h2><p class="muted">Planifica los platos de la semana y aquí aparecerán todos los ingredientes, sumados y ordenados por pasillos.</p><button class="btn primary" data-a="tab" data-v="semana">Ir a mi semana</button></div>`;
  const all=items.length+st.x.length,done=items.filter(i=>st.c[i.k]).length+st.x.filter(x=>x.c).length;
  const pend=items.filter(i=>!st.c[i.k]).reduce((s,i)=>s+i.c,0);

  for(const g of order){
    h+=`<section class="card aisle"><h3>${PASILLOS[g]}</h3>${groups[g].map(i=>`<button class="item ${st.c[i.k]?'done':''}" data-a="chk" data-k="${i.k}" aria-pressed="${!!st.c[i.k]}"><span class="box">${st.c[i.k]?I.check:''}</span><span class="nm grow">${esc(ING[i.k][0])}</span><span class="q">${fmtQty(i.k,i.q)} · ${eur(i.c)}</span></button>`).join('')}</section>`;
  }
  h+=`<section class="card aisle"><h3>Otras cosas</h3>${st.x.map(x=>`<div class="row"><button class="item grow ${x.c?'done':''}" data-a="chkx" data-id="${x.id}" aria-pressed="${!!x.c}"><span class="box">${x.c?I.check:''}</span><span class="nm grow">${esc(x.n)}</span></button><button class="iconbtn" style="width:34px;height:34px;border:0" data-a="delx" data-id="${x.id}" aria-label="Quitar ${esc(x.n)}">${I.x}</button></div>`).join('')}
    <form class="row" data-f="addx" style="margin-top:8px"><label class="sr" for="nx">Añadir a la lista</label><input id="nx" class="input" name="n" placeholder="Añadir: papel de cocina, fruta…" autocomplete="off"><button class="btn">Añadir</button></form></section>`;
  if(basics.length)h+=`<section class="card aisle"><h3>Revisa que tienes en casa</h3><p class="muted small" style="margin:0">${basics.map(k=>esc(ING[k][0])).join(' · ')}</p></section>`;
  h+=`<p class="note">Precios orientativos medios en España. Próximamente: los productos concretos y los precios de ${esc(SUPER_N[P().super]||'tu supermercado')}.</p>`;
  return h;
}

/* ---------- Hojas (detalle de receta y selector) ---------- */
function openSheet(s){sheet=s;renderSheet()}
function closeSheet(){sheet=null;renderSheet()}
function renderSheet(){
  const L=$('#layer');
  if(!sheet){L.innerHTML='';document.body.style.overflow='';return}
  const prev=L.querySelector('.sheet'),scroll=prev?.scrollTop||0;
  L.innerHTML=`<div class="scrim ${prev?'':'anim'}" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${sheet.type==='recipe'?'Receta':sheet.type==='friends'?'Compartir':sheet.type==='guia'?'Guía de calorías':sheet.type==='dpick'?'Apuntar comida':'Elegir plato'}"><div class="grab"></div>${sheet.type==='recipe'?recipeSheet():sheet.type==='friends'?shareSheet():sheet.type==='guia'?guideSheet():sheet.type==='dpick'?diaryPickSheet():pickSheet()}</div></div>`;
  document.body.style.overflow='hidden';
  const sh=L.querySelector('.sheet');if(sheet.keep)sh.scrollTop=scroll;sheet.keep=false;
}
function recipeSheet(){
  const r=RMAP[sheet.id],slot=sheet.slot?plan()[sheet.slot]:null;
  const m=sheet.m||(slot?.m)||defMethod(r),rac=sheet.p||slot?.p||P().personas,f=rac/BASE;
  const [mins,pasos]=r.m[m],mine=usableMethods(r);
  const c=recipeCost(r,rac);
  const main=r.ing.filter(([k])=>!ING[k][4]),bas=r.ing.filter(([k])=>ING[k][4]);
  const [d,meal]=sheet.slot?sheet.slot.split('-'):[];
  let h=`<div class="sheethead"><span class="eyebrow">${sheet.slot?DIAS[d]+' · '+meal:'Receta'}</span><div class="row"><button class="iconbtn" data-a="fav" data-id="${r.id}" aria-label="${isFav(r.id)?'Quitar de favoritas':'Añadir a favoritas'}" aria-pressed="${isFav(r.id)}" style="color:${isFav(r.id)?'var(--warm)':'inherit'};font-size:18px">${isFav(r.id)?'♥':'♡'}</button><button class="iconbtn" data-a="close" aria-label="Cerrar">${I.x}</button></div></div>
  <div class="stack"><div class="hero"><div class="emo" aria-hidden="true">${r.e}</div><div><h2>${esc(r.n)}</h2><div class="row wrap" style="gap:6px;margin-top:6px"><span class="badge accent">${flag(r)} ${coName(r)}</span>${r.tags.map(t=>`<span class="badge">${TAGN[t]||t}</span>`).join('')}</div></div></div>
  <div class="stack" style="gap:8px"><b>¿Cómo lo vas a cocinar?</b><div class="methods">${Object.keys(r.m).map(k=>`<button class="mbtn ${mine.includes(k)?'':'off'}" data-a="method" data-k="${k}" aria-pressed="${k===m}">${METODOS[k].n}<small>${r.m[k][0]} min${mine.includes(k)?'':' · no lo tienes'}</small></button>`).join('')}</div></div>
  <div class="summary"><div class="stat"><b>${mins}′</b><span>tiempo</span></div><div class="stat"><b>${eur(c/rac)}</b><span>por ración</span></div><div class="stat"><b>${eur(c)}</b><span>total</span></div></div>
  ${nutritionCard(r)}
  <section class="card"><div class="row between" style="margin-bottom:6px"><h3>Ingredientes</h3><div class="stepper"><button data-a="rac" data-d="-1" aria-label="Menos raciones">−</button><span class="num">${rac}</span><button data-a="rac" data-d="1" aria-label="Más raciones">+</button></div></div>
    <ul class="ings">${main.map(([k,q])=>`<li><span>${esc(ING[k][0])}${ING[k][5]?`<br><span class="badge warm" style="margin-top:4px">Ingrediente especial</span> <span class="muted small">Si no lo encuentras: ${esc(ING[k][5])}.</span>`:''}</span><span class="q">${fmtQty(k,q*f)}</span></li>`).join('')}</ul>
    ${bas.length?`<p class="muted small" style="margin:10px 0 0">De tu despensa: ${bas.map(([k])=>esc(ING[k][0]).toLowerCase()).join(', ')}.</p>`:''}</section>
  <section class="card"><h3 style="margin-bottom:12px">Preparación · ${METODOS[m].n}</h3><ol class="steps">${pasos.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>`;
  h+=diaryRecipeButtons(r);
  if(canSync())h+=`<button class="btn block" data-a="share-recipe">${I.share} Compartir con un amigo</button>`;
  if(sheet.slot)h+=`<div class="row"><button class="btn grow" data-a="swap">Cambiar plato</button><button class="btn" data-a="rmslot" style="color:var(--danger)">Quitar</button></div>`;
  else h+=`<section class="card stack"><h3>Añadir al menú</h3><p class="muted small" style="margin:0">Semana del ${fmtDay(weekStart)} · elige el hueco</p><div class="pickgrid" style="grid-template-columns:auto repeat(${meals().length},1fr)">${DIAS.map((dn,i)=>`<span class="small" style="font-weight:600">${dn.slice(0,3)}</span>${meals().map(([mm,mn])=>{const s=plan()[slotKey(i,mm)];return `<button class="pg ${s?'busy':''}" data-a="assign" data-s="${slotKey(i,mm)}" aria-label="${dn} ${mn}${s?', ahora '+esc(RMAP[s.r]?.n||''):''}">${s?esc(RMAP[s.r]?.e+' '+RMAP[s.r]?.n):mn}</button>`}).join('')}`).join('')}</div></section>`;
  return h+'</div>';
}
function pickSheet(){
  const [d,m]=sheet.slot.split('-');
  const s=(sheet.q||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
  const used=new Set(Object.values(plan()).map(x=>x.r));
  let list=RECETAS.filter(r=>usable(r)&&mealOk(r,m)&&(!s||r.n.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').includes(s)));
  list.sort((a,b)=>(isFav(b.id)-isFav(a.id))||(used.has(a.id)-used.has(b.id))||a.n.localeCompare(b.n,'es'));
  return `<div class="sheethead"><div><div class="eyebrow">${DIAS[d]}</div><h2>¿Qué hay de ${m}?</h2></div><button class="iconbtn" data-a="close" aria-label="Cerrar">${I.x}</button></div>
  <div class="stack"><button class="btn block" data-a="rand">${I.wand} Sorpréndeme</button>
  <div class="search">${I.search}<label class="sr" for="pq">Buscar</label><input id="pq" class="input" type="search" placeholder="Buscar plato" value="${esc(sheet.q||'')}" data-i="pq" autocomplete="off"></div>
  <div class="rlist" id="pres">${pickList(list,used)}</div></div>`;
}
function pickList(list,used){
  if(!list.length)return '<p class="muted">No hay platos que encajen. Revisa tus aparatos o tu dieta en el perfil.</p>';
  const n=sheet.n||PAGE;
  return list.slice(0,n).map(r=>`<button class="ritem" data-a="pick" data-id="${r.id}"><span class="emo">${r.e}</span><span class="grow"><b>${esc(r.n)}</b><br><span class="muted small">${flag(r)} ${r.m[defMethod(r)][0]} min · ${fmtN(nut(r).kcal)} kcal · ${eur(recipeCost(r,1))}/ración${used.has(r.id)?' · ya en la semana':''}</span></span>${isFav(r.id)?'<span style="color:var(--warm)">♥</span>':''}</button>`).join('')+(list.length>n?`<button class="btn block" data-a="pmore">Mostrar más (${list.length-n} restantes)</button>`:'');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='scrim'){if(e.target===b)closeSheet();return}
  if(a.startsWith('auth-'))return authClick(a,b);
  switch(a){
    case 'tab':view=b.dataset.v;if(view==='diario'){diaDate=new Date();diaDate.setHours(12,0,0,0)}if(view==='recetas')objF=null;closeSheet();render();scrollTo(0,0);if(view==='amigos')loadSocial(true);break;
    case 'wk':weekStart=addDays(weekStart,7*+b.dataset.d);render();break;
    case 'fill':fillWeek();break;
    case 'clear':if(confirm('¿Vaciar todos los platos de esta semana?')){S.semanas[wk()]={};save();render()}break;
    case 'slot':{const k=slotKey(b.dataset.d,b.dataset.m),s=plan()[k];openSheet(s?{type:'recipe',id:s.r,slot:k}:{type:'pick',slot:k});break}
    case 'open':openSheet({type:'recipe',id:b.dataset.id});break;
    case 'close':closeSheet();break;
    case 'more':shown+=PAGE;$('#rres').innerHTML=recipeGrid(filtered());break;
    case 'pmore':sheet.n=(sheet.n||PAGE)+PAGE;sheet.keep=true;renderSheet();break;
    case 'cocina':shown=PAGE;cocina=b.dataset.c;render();document.querySelector('[data-a="cocina"][aria-pressed="true"]')?.scrollIntoView({inline:'center',block:'nearest'});break;
    case 'mezcla':S.perfil.mezcla=b.dataset.k;save();render();break;
    case 'cocfav':{const c=b.dataset.c,l=S.perfil.cocinas||=[];S.perfil.cocinas=l.includes(c)?l.filter(x=>x!==c):[...l,c];save();render();break}
    case 'ob-mezcla':OB.d.mezcla=b.dataset.k;render();break;
    case 'filtro':shown=PAGE;filtro=b.dataset.f;render();document.querySelector('[data-a="filtro"][aria-pressed="true"]')?.scrollIntoView({inline:'center',block:'nearest'});break;
    case 'solomios':shown=PAGE;soloMios=b.checked;render();break;
    case 'fav':{const id=b.dataset.id;S.favs=isFav(id)?S.favs.filter(x=>x!==id):[...S.favs,id];save();sheet.keep=true;render();break}
    case 'method':{sheet.m=b.dataset.k;if(sheet.slot){plan()[sheet.slot].m=sheet.m;save()}sheet.keep=true;render();break}
    case 'rac':{const s=sheet.slot?plan()[sheet.slot]:null;const cur=sheet.p||s?.p||P().personas;const n=Math.min(12,Math.max(1,cur+ +b.dataset.d));sheet.p=n;if(s){s.p=n===P().personas?undefined:n;save()}sheet.keep=true;render();break}
    case 'assign':{const r=RMAP[sheet.id];plan()[b.dataset.s]={r:r.id,m:sheet.m||defMethod(r),...(sheet.p&&sheet.p!==P().personas?{p:sheet.p}:{})};save();const [d,m]=b.dataset.s.split('-');toast(`${r.n} → ${DIAS[d].toLowerCase()}, ${m}`);sheet.keep=true;render();break}
    case 'swap':openSheet({type:'pick',slot:sheet.slot});break;
    case 'rmslot':delete plan()[sheet.slot];save();closeSheet();render();break;
    case 'pick':{const r=RMAP[b.dataset.id];plan()[sheet.slot]={r:r.id,m:defMethod(r)};save();openSheet({type:'recipe',id:r.id,slot:sheet.slot});render();break}
    case 'rand':{const [,m]=sheet.slot.split('-');const used=new Set(Object.values(plan()).map(x=>x.r));let pool=RECETAS.filter(r=>usable(r)&&mealOk(r,m)&&!used.has(r.id));if(!pool.length)pool=RECETAS.filter(r=>usable(r)&&mealOk(r,m));if(!pool.length)return toast('No hay platos disponibles');const r=pool[Math.floor(Math.random()*pool.length)];plan()[sheet.slot]={r:r.id,m:defMethod(r)};save();openSheet({type:'recipe',id:r.id,slot:sheet.slot});render();break}
    case 'chk':{const st=shopState();st.c[b.dataset.k]?delete st.c[b.dataset.k]:st.c[b.dataset.k]=1;save();render();break}
    case 'chkx':{const x=shopState().x.find(x=>x.id===b.dataset.id);if(x){x.c=!x.c;save();render()}break}
    case 'delx':{const st=shopState();st.x=st.x.filter(x=>x.id!==b.dataset.id);save();render();break}
    case 'uncheck':{const st=shopState();st.c={};st.x.forEach(x=>x.c=false);save();render();break}
    case 'share':shareList();break;
    case 'pers':S.perfil.personas=Math.min(12,Math.max(1,S.perfil.personas+ +b.dataset.d));save();render();break;
    case 'apar':{const k=b.dataset.k,ap=S.perfil.aparatos;if(ap.includes(k)){if(ap.length===1)return toast('Necesitas al menos una forma de cocinar');S.perfil.aparatos=ap.filter(x=>x!==k)}else S.perfil.aparatos=[...ap,k];save();render();break}
    case 'dieta':S.perfil.dieta=b.dataset.k;save();render();break;
    case 'plan':{const m=b.dataset.m,on=planned(m);if(on&&meals().length===1)return toast('Planifica al menos una comida del día');(S.perfil.planificar||={})[m]=!on;save();render();break}
    case 'tema':S.tema=b.dataset.t||null;applyTheme();save();render();break;
    case 'logout':logout();break;

async function socialClick(a,b){
  const id=b.dataset.id,me=A.user?.id;
  const pair=x=>`and(requester.eq.${me},addressee.eq.${x}),and(requester.eq.${x},addressee.eq.${me})`;
  try{
    switch(a){
      case 'invite':{const text='Te invito a MC Food Diary: planifica tu menú semanal, elige recetas de todo el mundo y saca la lista de la compra.';
        try{if(navigator.share){await navigator.share({title:'MC Food Diary',text,url:APP_URL});return}}catch(e){if(e.name==='AbortError')return}
        await navigator.clipboard.writeText(text+' '+APP_URL);toast('Enlace copiado. Pégalo en WhatsApp o donde quieras');return}
      case 'fadd':{const r=relation(id);
        if(r?.incoming){const {error}=await sb.from('friendships').update({status:'accepted'}).eq('requester',id).eq('addressee',me);if(error)throw error;toast('¡Ahora sois amigos!')}
        else{const {error}=await sb.from('friendships').insert({requester:me,addressee:id});if(error)throw error;toast('Solicitud enviada')}
        return loadSocial()}
      case 'faccept':{const {error}=await sb.from('friendships').update({status:'accepted'}).eq('requester',id).eq('addressee',me);if(error)throw error;toast('¡Ahora sois amigos!');return loadSocial()}
      case 'fremove':{const r=relation(id);if(r?.status==='accepted'&&!confirm(`¿Quitar a @${b.dataset.nick} de tus amigos?`))return;
        const {error}=await sb.from('friendships').delete().or(pair(id));if(error)throw error;return loadSocial()}
      case 'share-recipe':{const r=RMAP[sheet.id];return openShare('receta',{id:r.id,m:sheet.m||plan()[sheet.slot]?.m||defMethod(r)},r.e+' '+r.n)}
      case 'share-week':return openShare('menu',{desde:wk(),plan:plan()},'Menú de la semana del '+fmtDay(weekStart))
      case 'send':{b.disabled=true;const {error}=await sb.from('shared_items').insert({from_user:me,to_user:id,kind:sheet.kind,payload:sheet.payload,message:(sheet.msg||'').trim()||null});
        if(error){b.disabled=false;throw error}toast('Enviado a @'+b.dataset.nick);closeSheet();return}
      case 'iopen':{const i=F.inbox.find(x=>x.id===id);openSheet({type:'recipe',id:i.payload.id,m:i.payload.m&&RMAP[i.payload.id]?.m[i.payload.m]?i.payload.m:undefined});return}
      case 'ifav':{const i=F.inbox.find(x=>x.id===id),rid=i.payload.id;if(!isFav(rid)){S.favs=[...S.favs,rid];save();toast('Guardada en favoritas')}return render()}
      case 'iview':{const i=F.inbox.find(x=>x.id===id);const list=Object.entries(i.payload.plan||{}).filter(([,x])=>RMAP[x.r]).sort(([a],[b])=>a.localeCompare(b));
        alert('Menú de @'+i.from_nick+':\n\n'+list.map(([k,x])=>{const [d,m]=k.split('-');return `${DIAS[d]} (${m}): ${RMAP[x.r].n}`}).join('\n'));return}
      case 'iuse':{const i=F.inbox.find(x=>x.id===id);const cur=plan();
        if(Object.keys(cur).length&&!confirm(`Tu semana del ${fmtDay(weekStart)} ya tiene platos. ¿Cambiarlos por el menú de @${i.from_nick}?`))return;
        const np={};for(const [k,x] of Object.entries(i.payload.plan||{})){const r=RMAP[x.r];if(!r)continue;np[k]={r:r.id,m:usableMethods(r).includes(x.m)?x.m:defMethod(r)}}
        S.semanas[wk()]=np;save();view='semana';render();scrollTo(0,0);toast(`Menú de @${i.from_nick} copiado a tu semana del ${fmtDay(weekStart)}`);return}
      case 'idel':{const {error}=await sb.from('shared_items').delete().eq('id',id);if(error)throw error;F.inbox=F.inbox.filter(x=>x.id!==id);return render()}
    }
  }catch(e){toast(errMsg(e))}
}
async function socialSubmit(f){
  if(f.dataset.f==='fsearch'){F.q=f.q.value.trim();if(F.q.length<2)return toast('Escribe al menos 2 letras');
    const {data,error}=await sb.rpc('search_profiles',{q:F.q});if(error)return toast(errMsg(error));F.results=data||[];return render()}
  if(f.dataset.f==='ident'){

/* ---------- Objetivos, calorías y nevera ---------- */
const OBJETIVOS=[['internacional','🌍','Menús internacionales','Recetas de 21 países para el día a día'],['perder','🥗','Perder peso','Menús ligeros y bajos en calorías'],['deporte','💪','Comer para entrenar','Más proteína, con desayunos y meriendas']];
const OBJ_N=Object.fromEntries(OBJETIVOS.map(([k,,n])=>[k,n]));
const KCAL_NIVELES=[1500,1800,2100,2400,2800,3200];
const KCAL_DEF={internacional:2000,perder:1800,deporte:2400};
const REPARTO={desayuno:.22,comida:.36,merienda:.12,cena:.30}; // parte orientativa de las calorías del día
const OBJ_FILTROS=[['todos','🍽️ Todo'],['internacional','🌍 Internacional'],['perder','🥗 Ligeras'],['deporte','💪 Deporte'],['snacks','🍳 Desayunos y meriendas']];
const fmtN=n=>Math.round(n).toLocaleString('es-ES');
const NUT={};const nut=r=>NUT[r.id]||=window.MC_NUTRI_RECETA(r);
const goal=()=>P().objetivo||'internacional';
const slotTarget=m=>(P().kcal||KCAL_DEF[goal()])*REPARTO[m];
function fitsGoal(r,g){const v=nut(r),snack=SNACK(r.tipo);
  if(g==='perder')return v.kcal<=(snack?300:550);
  if(g==='deporte')return snack?v.p>=12&&v.kcal<=550:v.p>=30&&v.p*4>=v.kcal*.25&&v.kcal>=350&&v.kcal<=850; // platos: proteína ≥30 g y ≥25 % de las calorías
  return !snack;
}
function objFilterOk(r,f){if(f==='todos')return true;if(f==='snacks')return SNACK(r.tipo);if(f==='internacional')return !SNACK(r.tipo);return fitsGoal(r,f)}
const defObjF=()=>({perder:'perder',deporte:'deporte'})[goal()]||'internacional';
function objChips(cur,action){return OBJ_FILTROS.map(([k,n])=>`<button class="chip" data-a="${action}" data-o="${k}" aria-pressed="${cur===k}">${n}</button>`).join('')}

/* Selector de objetivo: se usa en la bienvenida (pre=ob), en la pantalla de novedad (pre=gl) y en el perfil (pre=pf) */
function goalFields(d,pre){
  const g=d.objetivo||'internacional';
  return `<div class="stack" style="gap:10px">${OBJETIVOS.map(([k,ic,n,ds])=>`<button class="opt" data-a="${pre}-obj" data-k="${k}" aria-pressed="${g===k}"><span class="ico">${ic}</span><span><b>${n}</b><br><span class="muted small">${ds}</span></span></button>`).join('')}</div>
  <div class="stack" style="gap:8px"><b>${g==='internacional'?'Calorías al día (opcional, para orientarte)':'¿Cuántas calorías al día, más o menos?'}</b>
    <div class="chips wrap">${KCAL_NIVELES.map(n=>`<button class="chip" data-a="${pre}-kcal" data-n="${n}" aria-pressed="${(d.kcal||KCAL_DEF[g])===n}">${fmtN(n)} kcal</button>`).join('')}</div>
    <button type="button" class="link" data-a="guia" style="align-self:flex-start">No sé cuántas: ver la guía orientativa</button></div>`;
}
function applyGoal(d,k){d.objetivo=k;d.kcal=KCAL_DEF[k];if(k==='deporte'){d.planificar={...(d.planificar||{}),desayuno:true,merienda:true}}}
let GL=null;
function goalView(){
  GL||={objetivo:'internacional',kcal:KCAL_DEF.internacional};
  return `<div class="auth stack"><div class="logo">${I.logo}</div><span class="badge warm" style="align-self:flex-start">Novedad</span><h1>¿Qué buscas en MC Food Diary?</h1>
    <p class="muted">Ahora la app puede ayudarte a perder peso o a comer para entrenar, con calorías y proteínas en cada receta. Podrás cambiarlo cuando quieras en el Perfil.</p>
    ${goalFields(GL,'gl')}<button class="btn primary block" data-a="gl-save">Guardar</button></div>`;
}

  return `<div class="sheethead"><div><div class="eyebrow">Guía orientativa</div><h2>¿Cuántas calorías al día?</h2></div><button class="iconbtn" data-a="close" aria-label="Cerrar">${I.x}</button></div>
  <div class="stack"><p class="muted" style="margin:0">Cifras medias para adultos. Elige la que más se parezca a ti: no hace falta ser exacto.</p>

function nutritionCard(r){
  const v=nut(r),tot=v.p*4+v.hc*4+v.g*9||1,bar=(x,c)=>`<i style="width:${Math.round(x/tot*100)}%;background:${c}"></i>`;
  const tags=[fitsGoal(r,'perder')?'<span class="badge accent">🥗 Ligera</span>':'',fitsGoal(r,'deporte')?'<span class="badge accent">💪 Para deporte</span>':''].join('');
  return `<section class="card stack" style="gap:10px"><div class="row between"><h3>Por ración</h3><span class="muted small">valores orientativos</span></div>
    <div class="row wrap" style="gap:14px"><div><b style="font-family:var(--f-display);font-size:26px">${fmtN(v.kcal)}</b> <span class="muted">kcal</span></div>${tags}</div>
    <div class="macrobar" aria-hidden="true">${bar(v.p*4,'var(--accent)')}${bar(v.hc*4,'#D9A21B')}${bar(v.g*9,'var(--warm)')}</div>
    <div class="row between small"><span><b>${v.p} g</b> proteínas</span><span><b>${v.hc} g</b> hidratos</span><span><b>${v.g} g</b> grasas</span></div>
    ${goal()!=='internacional'?`<p class="muted small" style="margin:0">Tu objetivo: unas ${fmtN(P().kcal||KCAL_DEF[goal()])} kcal al día.</p>`:''}</section>`;
}

/* ---------- ¿Qué tengo en la nevera? ---------- */
const EQUIV=[['espagueti','macarron','pasta_corta','fideos','tallarines','fideua','orzo'],['arroz','arroz_largo','arroz_basmati','arroz_risotto','arroz_sushi','arroz_jazmin'],
  ['pollo_pechuga','pollo_muslos','pollo_entero','pollo_alitas'],['cebolla','cebolla_morada','chalota'],['tomate','tomate_cherry'],['tomate_triturado','tomate_frito'],
  ['carne_picada','carne_picada_ternera','cerdo_picado'],['queso_rallado','parmesano','queso_emmental','queso_curado'],['yogur','yogur_griego','yogur_proteico'],['pan_barra','pan_molde','pan_integral'],
  ['caldo_pollo','caldo_verduras','caldo_carne'],['lentejas','lentejas_rojas'],['alubias','alubias_rojas','alubias_negras','judiones'],['pimiento_rojo','pimiento_verde'],['lima','limon']];
const EQ={};for(const g of EQUIV)for(const k of g)EQ[k]=g;
const ALT={tomate_triturado:['tomate'],tomate_frito:['tomate','tomate_triturado'],caldo_pescado:['caldo_verduras']}; // lo que puede sustituir a un ingrediente (en un solo sentido)
const hasIng=k=>{const n=S.nevera||[];return n.includes(k)||(EQ[k]||[]).some(x=>n.includes(x))||(ALT[k]||[]).some(x=>n.includes(x)||(EQ[x]||[]).some(y=>n.includes(y)))};
const mainIngs=r=>[...new Set(r.ing.map(([k])=>k).filter(k=>ING[k]&&!ING[k][4]))];
const normTxt=s=>s.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
let NV={q:'',obj:null,shown:PAGE};
const FRECUENTES=(()=>{const c={};for(const r of RECETAS)for(const k of mainIngs(r))c[k]=(c[k]||0)+1;return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,30)})();
function fridgeMatches(){
  const n=S.nevera||[];if(!n.length)return [];
  const f=NV.obj||defObjF(),out=[];
  for(const r of RECETAS){
    if(!usable(r)||!objFilterOk(r,f))continue;
    const ings=mainIngs(r),have=ings.filter(hasIng);if(have.length<Math.min(2,ings.length)||ings.length-have.length>3)continue; // como mucho 3 cosas por comprar
    out.push({r,have:have.length,total:ings.length,missing:ings.filter(k=>!hasIng(k))});
  }
  return out.sort((a,b)=>a.missing.length-b.missing.length||b.have-a.have||nut(a.r).kcal-nut(b.r).kcal);
}
function fridgeSuggest(){
  const s=normTxt(NV.q.trim());if(s.length<2)return '';
  const n=S.nevera||[];
  const l=Object.keys(ING).filter(k=>!ING[k][4]&&!n.includes(k)&&normTxt(ING[k][0]).includes(s)).slice(0,8);
  return l.length?`<div class="chips wrap" style="margin-top:8px">${l.map(k=>`<button class="chip" data-a="nadd" data-k="${k}">+ ${esc(ING[k][0])}</button>`).join('')}</div>`:'<p class="muted small" style="margin:8px 0 0">No encontramos ese ingrediente.</p>';
}
function fridgeView(){
  const n=S.nevera||[],res=fridgeMatches(),f=NV.obj||defObjF();
  let h=`<section class="card stack"><div><h3>¿Qué tienes en la nevera?</h3><p class="muted small" style="margin:4px 0 0">Marca lo que tienes en casa y te decimos qué puedes cocinar. Aceite, sal y especias los damos por supuestos.</p></div>
    <div class="search">${I.search}<label class="sr" for="nq">Buscar ingrediente</label><input id="nq" class="input" type="search" placeholder="Añadir ingrediente: pollo, arroz, huevos…" value="${esc(NV.q)}" data-i="nq" autocomplete="off"></div>
    <div id="nsug">${fridgeSuggest()}</div>
    ${n.length?`<div><div class="row between"><b>Tienes (${n.length})</b><button class="link" data-a="nclear">Vaciar</button></div><div class="chips wrap" style="margin-top:8px">${n.map(k=>`<button class="chip" data-a="ndel" data-k="${k}" aria-pressed="true" aria-label="Quitar ${esc(ING[k]?.[0]||k)}">${esc(ING[k]?.[0]||k)} ✕</button>`).join('')}</div></div>`:''}
    <details ${n.length?'':'open'}><summary class="small" style="font-weight:600;cursor:pointer">Lo más habitual</summary><div class="chips wrap" style="margin-top:8px">${FRECUENTES.filter(k=>!n.includes(k)).map(k=>`<button class="chip" data-a="nadd" data-k="${k}">+ ${esc(ING[k][0])}</button>`).join('')}</div></details></section>`;
  if(!n.length)return h+`<div class="card empty"><div class="big">🧊</div><p class="muted">Añade al menos un ingrediente para ver recetas.</p></div>`;
  h+=`<div class="chips" role="group" aria-label="Tipo de receta">${objChips(f,'nobj')}</div>`;
  if(!res.length)return h+`<div class="card empty"><div class="big">🤔</div><p class="muted">No hay recetas para las que te falten 3 cosas o menos. Añade algún ingrediente más o cambia el tipo de menú.</p></div>`;
  const listo=res.filter(x=>!x.missing.length).length;
  h+=`<p class="muted small" style="margin:0">${listo?`<b>${listo}</b> recetas que puedes hacer ya · `:''}${res.length} recetas en total</p><div class="rlist">`;
  h+=res.slice(0,NV.shown).map(({r,have,total,missing})=>`<div class="ritem" style="align-items:flex-start"><span class="emo">${r.e}</span><span class="grow stack" style="gap:4px">
      <button class="link" data-a="open" data-id="${r.id}" style="text-align:left;text-decoration:none;color:inherit"><b>${esc(r.n)}</b></button>
      <span class="muted small">${flag(r)} ${r.m[defMethod(r)][0]} min · ${fmtN(nut(r).kcal)} kcal · tienes ${have} de ${total}</span>
      ${missing.length?`<span class="small">Te falta: ${missing.map(k=>esc(ING[k][0].toLowerCase())).join(', ')}</span><button class="btn sm" data-a="nmiss" data-id="${r.id}" style="align-self:flex-start">+ Añadir lo que falta a la lista</button>`:'<span class="badge accent" style="align-self:flex-start">✓ Lo tienes todo</span>'}</span></div>`).join('');
  h+='</div>'+(res.length>NV.shown?`<button class="btn block" data-a="nmore">Mostrar más (${res.length-NV.shown} restantes)</button>`:'');
  return h;
}

function goalClick(a,b){
  const pre=a.slice(0,2),act=a.slice(3);
  if(['ob','gl','pf'].includes(pre)&&(act==='obj'||act==='kcal')){
    const d=pre==='ob'?OB.d:pre==='gl'?GL:S.perfil;
    if(act==='obj')applyGoal(d,b.dataset.k);else d.kcal=+b.dataset.n;
    if(pre==='pf'){save();NV.obj=null;objF=null}render();return true;
  }
  switch(a){
    case 'gl-save':S.perfil={...S.perfil,...GL,planificar:{...(S.perfil.planificar||{}),...(GL.planificar||{})}};GL=null;save();render();toast('Guardado. Lo puedes cambiar en el Perfil');return true;
    case 'guia':openSheet({type:'guia'});return true;
    case 'nadd':{const k=b.dataset.k;S.nevera=[...new Set([...(S.nevera||[]),k])];NV.q='';NV.shown=PAGE;save();render();$('#nq')?.focus();return true}
    case 'ndel':S.nevera=(S.nevera||[]).filter(x=>x!==b.dataset.k);NV.shown=PAGE;save();render();return true;
    case 'nclear':if(confirm('¿Vaciar la lista de lo que tienes en casa?')){S.nevera=[];save();render()}return true;
    case 'nobj':NV.obj=b.dataset.o;NV.shown=PAGE;render();return true;
    case 'nmore':NV.shown+=PAGE;render();return true;
    case 'nmiss':{const r=RMAP[b.dataset.id],st=shopState(),ya=new Set(st.x.map(x=>normTxt(x.n)));let n=0;
      for(const k of mainIngs(r))if(!hasIng(k)&&!ya.has(normTxt(ING[k][0]))){st.x.push({id:uid(),n:ING[k][0],c:false});n++}
      save();toast(n?`Añadido a la lista de la compra (${n})`:'Ya estaba en la lista');return true}
    case 'objf':objF=b.dataset.o;shown=PAGE;render();document.querySelector('[data-a="objf"][aria-pressed="true"]')?.scrollIntoView({inline:'center',block:'nearest'});return true;
  }
  return false;
}
document.addEventListener('input',e=>{if(e.target.dataset.i==='nq'){NV.q=e.target.value;$('#nsug').innerHTML=fridgeSuggest()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.i==='nq'){const f=$('#nsug [data-a="nadd"]');if(f){e.preventDefault();f.click()}}});

/* ---------- Diario: lo que comes de verdad, con fecha y comida ---------- */
// S.diario = { 'AAAA-MM-DD': [ {id, meal, r?: receta, m?: método, n?: texto libre, kcal?: número, plan?: true} ] }
let diaDate=new Date();diaDate.setHours(12,0,0,0);
const diaKey=d=>ymd(d);
const diaList=k=>(S.diario||={})[k]||[];
const mealNow=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return h<11?'desayuno':h<16.5?'comida':h<20?'merienda':'cena'};
const MEAL_N=Object.fromEntries(MEALS);
function planFor(date,meal){const w=S.semanas[ymd(monday(date))]||{};return w[slotKey((date.getDay()+6)%7,meal)]}
const entryKcal=e=>e.r&&RMAP[e.r]?nut(RMAP[e.r]).kcal:(+e.kcal||0);
const entryProt=e=>e.r&&RMAP[e.r]?nut(RMAP[e.r]).p:0;
function logEntry(date,meal,entry){
  const k=diaKey(date),l=diaList(k);
  if(entry.r&&l.some(e=>e.meal===meal&&e.r===entry.r))return toast('Ya lo tenías apuntado');
  S.diario[k]=[...l,{id:uid(),meal,...entry}];save();
  const r=entry.r&&RMAP[entry.r];toast(`Apuntado en tu diario: ${r?r.n:entry.n} (${MEAL_N[meal].toLowerCase()})`);
}
const isLogged=(date,meal,rid)=>diaList(diaKey(date)).some(e=>e.meal===meal&&e.r===rid);

function diaryView(){
  const today=new Date();today.setHours(12,0,0,0);
  const k=diaKey(diaDate),l=diaList(k),isToday=k===diaKey(today);
  const kc=l.reduce((t,e)=>t+entryKcal(e),0),pr=l.reduce((t,e)=>t+entryProt(e),0),obj=goal()!=='internacional'?(P().kcal||KCAL_DEF[goal()]):0;
  const label=isToday?'Hoy':k===diaKey(addDays(today,-1))?'Ayer':diaDate.toLocaleDateString('es-ES',{weekday:'long'});
  let h=verdictBanner()+`<div class="weeknav"><button class="iconbtn" data-a="dday" data-d="-1" aria-label="Día anterior">${I.left}</button>
    <div style="text-align:center"><div class="eyebrow">${esc(label)}</div><b>${diaDate.toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</b></div>
    <button class="iconbtn" data-a="dday" data-d="1" aria-label="Día siguiente" ${isToday?'disabled style="opacity:.35"':''}>${I.right}</button></div>
  <div class="summary"><div class="stat"><b>${fmtN(kc)}</b><span>kcal${obj?' de '+fmtN(obj):''}</span></div><div class="stat"><b>${fmtN(pr)} g</b><span>proteínas</span></div><div class="stat"><b>${l.length}</b><span>${l.length===1?'comida apuntada':'comidas apuntadas'}</span></div></div>
  ${obj?`<div class="progress" aria-hidden="true"><i style="width:${Math.min(100,kc/obj*100)}%;${kc>obj*1.1?'background:var(--warm)':''}"></i></div>`:''}`;
  for(const [m,mn] of MEALS){
    const es=l.filter(e=>e.meal===m),pl=planFor(diaDate,m),pr=pl&&RMAP[pl.r];
    h+=`<section class="day"><div class="dayhead"><b>${mn}</b>${es.length?`<span class="muted small">${fmtN(es.reduce((t,e)=>t+entryKcal(e),0))} kcal</span>`:''}</div>`;
    h+=es.map(e=>{const r=e.r&&RMAP[e.r];return `<div class="slotw"><button class="slot" ${r?`data-a="open" data-id="${r.id}"`:'disabled'} style="padding-right:58px"><span class="emo">${r?r.e:'🍽️'}</span><span class="grow"><span class="t">${esc(r?r.n:e.n)}</span><br><span class="muted small">${entryKcal(e)?fmtN(entryKcal(e))+' kcal':'sin calorías'}${e.plan?' · del menú':''}</span></span></button><button class="iconbtn eat" data-a="ddel" data-id="${e.id}" aria-label="Quitar ${esc(r?r.n:e.n)}" style="border:0;background:transparent">${I.x}</button></div>`}).join('');
    if(pr&&!es.some(e=>e.r===pl.r))h+=`<div class="slotw"><div class="slot" style="padding-right:12px"><span class="emo" style="opacity:.6">${pr.e}</span><span class="grow"><span class="muted small">En tu menú:</span><br><span class="t">${esc(pr.n)}</span></span><button class="btn sm primary" data-a="dplan" data-m="${m}">✓ Lo he comido</button></div></div>`;
    h+=`<button class="slot empty" data-a="dadd" data-m="${m}"><span class="emo">+</span><span class="add">Apuntar ${mn.toLowerCase()}</span></button></section>`;
  }
  h+=progressCard(k)+`
  <p class="note">El diario guarda lo que comes de verdad. Para preparar la semana por adelantado, usa la pestaña Semana; desde allí también puedes marcar “Lo he comido”.</p>`;
  return h;
}

/* Hoja para apuntar una comida en el diario */
function diaryPickSheet(){
  const m=sheet.meal,d=sheet.date,pl=planFor(d,m),pr=pl&&RMAP[pl.r];
  const s=normTxt(sheet.q||''),recent=[...new Set(Object.keys(S.diario||{}).sort().reverse().flatMap(k=>S.diario[k].filter(e=>e.r&&e.meal===m).map(e=>e.r)))].slice(0,6);
  let list=RECETAS.filter(r=>s?normTxt(r.n).includes(s):mealOk(r,m)); // al buscar, cualquier receta
  if(!s)list=list.filter(r=>isFav(r.id)||recent.includes(r.id)||usable(r));
  list.sort((a,b)=>(recent.includes(b.id)-recent.includes(a.id))||(isFav(b.id)-isFav(a.id))||a.n.localeCompare(b.n,'es'));
  const n=sheet.n||PAGE;
  return `<div class="sheethead"><div><div class="eyebrow">${d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}</div><h2>¿Qué has comido de ${MEAL_N[m].toLowerCase()}?</h2></div><button class="iconbtn" data-a="close" aria-label="Cerrar">${I.x}</button></div>
  <div class="stack">${pr?`<button class="ritem" data-a="dpick" data-id="${pr.id}" data-plan="1" style="border-color:var(--accent)"><span class="emo">${pr.e}</span><span class="grow"><span class="muted small">De tu menú</span><br><b>${esc(pr.n)}</b></span><span class="badge accent">✓</span></button>`:''}
  <div class="search">${I.search}<label class="sr" for="dq">Buscar receta</label><input id="dq" class="input" type="search" placeholder="Buscar receta" value="${esc(sheet.q||'')}" data-i="dq" autocomplete="off"></div>
  <div class="rlist" id="dres">${list.slice(0,n).map(r=>`<button class="ritem" data-a="dpick" data-id="${r.id}"><span class="emo">${r.e}</span><span class="grow"><b>${esc(r.n)}</b><br><span class="muted small">${fmtN(nut(r).kcal)} kcal${recent.includes(r.id)?' · la tomaste hace poco':''}</span></span>${isFav(r.id)?'<span style="color:var(--warm)">♥</span>':''}</button>`).join('')||'<p class="muted">No hay recetas con ese nombre. Apúntalo abajo como otra cosa.</p>'}${list.length>n?`<button class="btn block" data-a="dmore">Mostrar más (${list.length-n} restantes)</button>`:''}</div>
  <form class="card stack" data-f="dfree" style="gap:10px"><b>¿Otra cosa?</b><p class="muted small" style="margin:0">Algo que no está en las recetas: un menú del bar, una pieza de fruta…</p>
    <input class="input" name="n" placeholder="Por ejemplo: menú del día en el trabajo" maxlength="80" required>
    <div class="row"><input class="input" name="kcal" type="number" inputmode="numeric" min="0" max="3000" placeholder="kcal (opcional)" style="max-width:150px"><button class="btn primary grow">Apuntar</button></div></form></div>`;
}

function diaryClick(a,b){
  switch(a){
    case 'dday':{const nd=addDays(diaDate,+b.dataset.d),t=new Date();t.setHours(12,0,0,0);if(nd>t)return true;diaDate=nd;render();return true}
    case 'dgo':{const [y,mo,d]=b.dataset.k.split('-').map(Number);diaDate=new Date(y,mo-1,d,12);render();return true}
    case 'dadd':openSheet({type:'dpick',meal:b.dataset.m,date:new Date(diaDate)});return true;
    case 'dmore':sheet.n=(sheet.n||PAGE)+PAGE;sheet.keep=true;renderSheet();return true;
    case 'dpick':{const r=RMAP[b.dataset.id],pl=planFor(sheet.date,sheet.meal);logEntry(sheet.date,sheet.meal,{r:r.id,m:pl?.r===r.id?pl.m:defMethod(r),...(b.dataset.plan?{plan:true}:{})});closeSheet();render();return true}
    case 'dplan':{const m=b.dataset.m,pl=planFor(diaDate,m);if(pl)logEntry(diaDate,m,{r:pl.r,m:pl.m,plan:true});render();return true}
    case 'ddel':{const k=diaKey(diaDate);S.diario[k]=diaList(k).filter(e=>e.id!==b.dataset.id);if(!S.diario[k].length)delete S.diario[k];save();render();return true}
    case 'eat':{const date=addDays(weekStart,+b.dataset.d),m=b.dataset.m,s=plan()[slotKey(b.dataset.d,m)];if(!s)return true;
      if(isLogged(date,m,s.r)){const k=diaKey(date);S.diario[k]=diaList(k).filter(e=>!(e.meal===m&&e.r===s.r));if(!S.diario[k].length)delete S.diario[k];save();toast('Quitado del diario')}
      else logEntry(date,m,{r:s.r,m:s.m,plan:true});render();return true}
    case 'dlog':{const r=RMAP[sheet.id];if(sheet.slot){const [d,m]=sheet.slot.split('-');const date=addDays(weekStart,+d);logEntry(date,m,{r:r.id,m:sheet.m||plan()[sheet.slot]?.m||defMethod(r),plan:true})}
      else{const t=new Date();t.setHours(12,0,0,0);logEntry(t,b.dataset.m,{r:r.id,m:sheet.m||defMethod(r)})}sheet.keep=true;render();return true}
  }
  return false;
}
document.addEventListener('input',e=>{if(e.target.dataset.i==='dq'&&sheet){sheet.q=e.target.value;sheet.n=PAGE;const L=$('#layer .sheet');const sc=L.scrollTop;renderSheet();const i=$('#dq');i.focus();i.setSelectionRange(i.value.length,i.value.length);$('#layer .sheet').scrollTop=sc}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.f!=='dfree')return;e.preventDefault();const n=f.n.value.trim();if(!n)return;const kc=Math.max(0,Math.round(+f.kcal.value||0));
  logEntry(sheet.date,sheet.meal,{n,...(kc?{kcal:kc}:{})});closeSheet();render()});

/* Botón del diario en la ficha de una receta */
function diaryRecipeButtons(r){
  if(sheet.slot){const [d,m]=sheet.slot.split('-'),date=addDays(weekStart,+d),t=new Date();t.setHours(23,59,0,0);
    if(date>t)return '';
    return isLogged(date,m,r.id)?`<p class="badge accent" style="align-self:flex-start">✓ Apuntado en tu diario</p>`:`<button class="btn block primary" data-a="dlog">✓ Lo he comido</button>`}
  return `<section class="card stack" style="gap:8px"><h3>Apuntar en mi diario de hoy</h3><div class="chips wrap">${MEALS.map(([m,n])=>`<button class="chip" data-a="dlog" data-m="${m}" ${isLogged((()=>{const t=new Date();t.setHours(12,0,0,0);return t})(),m,r.id)?'aria-pressed="true"':''}>${n}</button>`).join('')}</div></section>`;
}

/* ---------- Progreso: calorías de los últimos días y valoración según el objetivo ---------- */
let PR={dias:7};
const MIN_COMIDAS=2;   // un día cuenta si tiene al menos 2 comidas apuntadas
const MIN_DIAS=3;      // días necesarios para dar una valoración
function progressData(n){
  const t=new Date();t.setHours(12,0,0,0);
  const days=[...Array(n)].map((_,i)=>{const d=addDays(t,i-n+1),l=diaList(diaKey(d));
    return {d,k:diaKey(d),kcal:l.reduce((s,e)=>s+entryKcal(e),0),rk:l.reduce((s,e)=>s+(e.r&&RMAP[e.r]?entryKcal(e):0),0),p:l.reduce((s,e)=>s+entryProt(e),0),n:l.length,ok:l.length>=MIN_COMIDAS}});
  const full=days.filter(x=>x.ok),avg=f=>full.length?full.reduce((s,x)=>s+f(x),0)/full.length:0;
  const tk=full.reduce((s,x)=>s+x.kcal,0),pCover=tk?full.reduce((s,x)=>s+x.rk,0)/tk:0; // parte de las calorías que vienen de recetas (con proteína conocida)
  return {days,full,kcal:avg(x=>x.kcal),p:avg(x=>x.p),pOk:pCover>=.7,target:P().kcal||KCAL_DEF[goal()]};
}
function verdict(pd){
  const g=goal(),T=pd.target,a=pd.kcal,diff=Math.round(a-T),n=pd.full.length;
  if(n<MIN_DIAS)return {tone:'info',icon:'📝',title:'Sigue apuntando',text:`Cuando tengas ${MIN_DIAS} días completos (al menos ${MIN_COMIDAS} comidas cada uno) te diremos cómo vas. Llevas ${n}.`};
  const r=a/T,pMin=Math.round(T*.2/4); // proteína: al menos un 20 % de las calorías
  if(g==='perder'){
    if(r<.75)return {tone:'warn',icon:'⚠️',title:'Estás comiendo demasiado poco',text:`Tu media es de ${fmtN(a)} kcal, muy por debajo de tu objetivo (${fmtN(T)}). Comer tan poco cuesta mantenerlo y no ayuda a perder peso de forma sana. Añade una merienda o raciones algo más grandes.`};
    if(r<=1.05)return {tone:'ok',icon:'✅',title:'Vas bien',text:`Tu media es de ${fmtN(a)} kcal al día, dentro de tu objetivo de ${fmtN(T)}. ¡Sigue así!`};
    if(r<=1.15)return {tone:'mid',icon:'🟡',title:'Casi: te pasas un poco',text:`De media comes unas ${fmtN(diff)} kcal más que tu objetivo. Prueba con más cenas ligeras (filtro 🥗 Ligeras) o raciones un poco más pequeñas.`};
    return {tone:'warn',icon:'⚠️',title:'Te estás pasando',text:`De media comes unas ${fmtN(diff)} kcal al día más que tu objetivo (${fmtN(T)}). Así es difícil perder peso. Planifica la semana con el objetivo «Perder peso» y elige platos ligeros.`};
  }
  if(g==='deporte'){
    const pl=pd.pOk&&pd.p<pMin?` Además, tu proteína media (${fmtN(pd.p)} g) es baja: intenta llegar a unos ${pMin} g al día.`:'';
    if(r<.85)return {tone:'warn',icon:'⚠️',title:'Te quedas corto',text:`Tu media es de ${fmtN(a)} kcal y tu objetivo ${fmtN(T)}. Si entrenas, comer poco afecta al rendimiento y a la recuperación. Añade desayuno o merienda.${pl}`};
    if(r<=1.12)return pl?{tone:'mid',icon:'🟡',title:'Calorías bien, falta proteína',text:`Tu media es de ${fmtN(a)} kcal, en línea con tu objetivo.${pl}`}:{tone:'ok',icon:'✅',title:'Vas bien',text:`Tu media es de ${fmtN(a)} kcal${pd.pOk?` y ${fmtN(pd.p)} g de proteína`:''} al día. Buen equilibrio para entrenar.`};
    return {tone:'mid',icon:'🟡',title:'Te pasas un poco',text:`De media comes unas ${fmtN(diff)} kcal más que tu objetivo de ${fmtN(T)}. Si no buscas ganar peso, ajusta las raciones.${pl}`};
  }
  if(r<.8)return {tone:'mid',icon:'🟡',title:'Por debajo de lo habitual',text:`Tu media es de ${fmtN(a)} kcal, bastante por debajo de tu referencia de ${fmtN(T)}.`};
  if(r>1.2)return {tone:'mid',icon:'🟡',title:'Por encima de lo habitual',text:`Tu media es de ${fmtN(a)} kcal, por encima de tu referencia de ${fmtN(T)}.`};
  return {tone:'ok',icon:'✅',title:'Comes equilibrado',text:`Tu media es de ${fmtN(a)} kcal al día, cerca de tu referencia de ${fmtN(T)}.`};
}
const TONE={ok:'var(--accent)',mid:'#C48A0A',warn:'var(--warm)',info:'var(--muted)'};
function verdictBanner(){
  const v=verdict(progressData(7));
  return `<button class="verdict" data-a="goprog" style="--tone:${TONE[v.tone]}"><span class="vi" aria-hidden="true">${v.icon}</span><span class="grow"><b>${esc(v.title)}</b><br><span class="small muted">Últimos 7 días · ver progreso</span></span>${I.right}</button>`;
}
function progressCard(sel){
  const n=PR.dias,pd=progressData(n),v=verdict(pd),T=pd.target,W=320,H=150,top=Math.max(T*1.35,...pd.days.map(x=>x.kcal),1);
  const y=k=>H-18-(k/top)*(H-30),bw=(W-8)/n,lo=goal()==='perder'?T*.75:T*.85,hi=goal()==='perder'?T*1.05:T*1.12;
  const col=x=>!x.ok?'var(--surface-2)':x.kcal<lo?'#D9A21B':x.kcal>hi?'var(--warm)':'var(--accent)';
  const lbl=(x,i)=>n===7?'LMXJVSD'[(x.d.getDay()+6)%7]:(i%(n===14?2:5)===0||i===n-1)?x.d.getDate():'';
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="pchart" role="img" aria-label="Calorías por día de los últimos ${n} días frente a tu objetivo de ${fmtN(T)} kcal">
    <rect x="0" y="${y(hi)}" width="${W}" height="${y(lo)-y(hi)}" fill="var(--accent)" opacity=".12"/>
    <line x1="0" x2="${W}" y1="${y(T)}" y2="${y(T)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.5"/>
    ${pd.days.map((x,i)=>`<g><title>${x.d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}: ${x.n?fmtN(x.kcal)+' kcal':'sin datos'}${x.n&&!x.ok?' (día incompleto)':''}</title>
      <rect data-a="dgo" data-k="${x.k}" x="${4+i*bw+bw*.15}" y="${x.n?y(Math.max(x.kcal,top*.02)):H-20}" width="${bw*.7}" height="${x.n?H-18-y(Math.max(x.kcal,top*.02)):2}" rx="${Math.min(4,bw*.2)}" fill="${col(x)}" ${x.k===sel?'stroke="var(--ink)" stroke-width="1.5"':''} style="cursor:pointer"/>
      <text x="${4+i*bw+bw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${lbl(x,i)}</text></g>`).join('')}
    <text x="${W-2}" y="${y(T)-4}" text-anchor="end" font-size="10" fill="var(--accent)" font-weight="600">${fmtN(T)}</text></svg>`;
  // Comparación con el periodo anterior
  const prev=progressData(n*2),prevFull=prev.full.filter(x=>!pd.days.some(d=>d.k===x.k)),pAvg=prevFull.length?prevFull.reduce((s,x)=>s+x.kcal,0)/prevFull.length:0;
  const trend=pAvg&&pd.full.length?Math.round(pd.kcal-pAvg):null;
  return `<section class="card stack" id="progreso" style="gap:12px"><div class="row between wrap"><h3>Tu progreso</h3>
      <div class="seg" role="group" aria-label="Periodo" style="min-width:190px">${[7,14,30].map(d=>`<button data-a="prdias" data-n="${d}" aria-pressed="${n===d}">${d} días</button>`).join('')}</div></div>
    <div class="verdictbox" style="--tone:${TONE[v.tone]}"><b>${v.icon} ${esc(v.title)}</b><p style="margin:4px 0 0">${esc(v.text)}</p></div>
    ${svg}
    <div class="legend small"><span><i style="background:var(--accent)"></i>En tu objetivo</span><span><i style="background:var(--warm)"></i>Por encima</span><span><i style="background:#D9A21B"></i>Por debajo</span><span><i style="background:var(--surface-2)"></i>Día incompleto</span></div>
    <div class="summary"><div class="stat"><b>${pd.full.length?fmtN(pd.kcal):'—'}</b><span>kcal de media</span></div><div class="stat"><b>${pd.full.length&&pd.pOk?fmtN(pd.p)+' g':'—'}</b><span>${pd.full.length&&!pd.pOk?'proteína: faltan datos':'proteína media'}</span></div><div class="stat"><b>${pd.full.length}/${n}</b><span>días completos</span></div></div>
    ${trend!==null?`<p class="small" style="margin:0">${trend<=-50?'📉':trend>=50?'📈':'➡️'} Respecto a los ${n} días anteriores: <b>${trend>0?'+':''}${fmtN(trend)} kcal</b> de media.</p>`:''}
    <p class="muted small" style="margin:0">Solo cuentan los días con al menos ${MIN_COMIDAS} comidas apuntadas. Es una orientación a partir de valores aproximados, no un consejo médico.</p></section>`;
}
function progressClick(a,b){
  if(a==='prdias'){PR.dias=+b.dataset.n;const y=scrollY;render();scrollTo(0,y);return true}
  if(a==='goprog'){document.getElementById('progreso')?.scrollIntoView({behavior:'smooth',block:'start'});return true}
  return false;
}

async function init(){
  if(!sb){useKey('mcfd.local');A.status='ready';render();return}
  render();
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(!session){A.status='auth';render()}else await onSession(session);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'&&A.user){A.user=null;A.status='auth';A.mode='login';render()}});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!S.tema)render()});
init();
</script>
